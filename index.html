    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          
          function tryDefine(obj, prop, descriptor) {
            try {
              Object.defineProperty(obj, prop, descriptor);
              return true;
            } catch (e) {
              return false;
            }
          }
          
          if (!currentFetch && typeof Window !== 'undefined' && Window.prototype) {
            var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (desc && desc.get) {
              currentFetch = desc.get.call(window);
            }
          }
          if (!currentFetch) {
            currentFetch = window.fetch || function() { return Promise.reject("Fetch unavailable"); };
          }
          
          var descriptor = {
            get: function() { return currentFetch; },
            set: function(val) { currentFetch = val; },
            configurable: true,
            enumerable: true
          };

          try {
            delete window.fetch;
          } catch(e) {}
          tryDefine(window, 'fetch', descriptor);
          
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              delete Window.prototype.fetch;
            } catch(e) {}
            tryDefine(Window.prototype, 'fetch', descriptor);
          }
          
          if (typeof globalThis !== 'undefined') {
            try {
              delete globalThis.fetch;
            } catch(e) {}
            tryDefine(globalThis, 'fetch', descriptor);
          }
          if (typeof self !== 'undefined') {
            try {
              delete self.fetch;
            } catch(e) {}
            tryDefine(self, 'fetch', descriptor);
          }

          // Remove obsolete browser caches before testing storage. These records
          // are hydrated from Supabase and can otherwise fill the quota before
          // the React application gets a chance to clean them up.
          var storageTestOk = false;
          try {
            if (typeof window !== 'undefined' && window.localStorage) {
              [
                'crm_cold_leads',
                'crm_comercial_leads',
                'crm_comerciales_accounts',
                'crm_projects',
                'althera_contacts_cache',
                'althera_events_cache',
                'althera_commercial_private_events',
                'althera_deleted_contact_ids',
                'althera_landing_partners',
                'althera_audit_pending_v1',
                'althera_handled_closing_alerts',
                'agency_read_notifications'
              ].forEach(function(key) {
                try { window.localStorage.removeItem(key); } catch (cleanupError) {}
              });
              window.localStorage.setItem('__aistudio_test_ls_key__', '1');
              window.localStorage.removeItem('__aistudio_test_ls_key__');
              storageTestOk = true;
            }
          } catch (storageError) {
            var isQuotaExceeded = storageError && (
              storageError.name === 'QuotaExceededError' ||
              storageError.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
              storageError.code === 22 ||
              storageError.code === 1014
            );
            if (isQuotaExceeded && typeof window !== 'undefined' && window.localStorage) {
              // A full storage is still readable and contains the Supabase auth
              // session. Replacing it with an empty memory store would log the
              // user out and leave session validation waiting indefinitely.
              storageTestOk = true;
              console.warn('Browser storage quota reached; preserving the existing authenticated storage.');
            } else {
              console.warn("Storage access denied. Implementing in-memory fallback:", storageError);
            }
          }

          if (!storageTestOk) {
            function createMemStorage() {
              var store = {};
              return {
                getItem: function(key) {
                  return Object.prototype.hasOwnProperty.call(store, key) ? store[key] : null;
                },
                setItem: function(key, val) {
                  store[key] = String(val);
                },
                removeItem: function(key) {
                  delete store[key];
                },
                clear: function() {
                  store = {};
                },
                key: function(idx) {
                  var keys = Object.keys(store);
                  return keys[idx] || null;
                },
                get length() {
                  return Object.keys(store).length;
                }
              };
            }

            var memLocalStorage = createMemStorage();
            var memSessionStorage = createMemStorage();

            tryDefine(window, 'localStorage', {
              get: function() { return memLocalStorage; },
              configurable: true,
              enumerable: true
            });
            tryDefine(window, 'sessionStorage', {
              get: function() { return memSessionStorage; },
              configurable: true,
              enumerable: true
            });

            if (typeof Window !== 'undefined' && Window.prototype) {
              tryDefine(Window.prototype, 'localStorage', {
                get: function() { return memLocalStorage; },
                configurable: true,
                enumerable: true
              });
              tryDefine(Window.prototype, 'sessionStorage', {
                get: function() { return memSessionStorage; },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (globalError) {
          console.warn("Global catch in fetch patch:", globalError);
        }
      })();
    </script>
